name: Build YazedTeacherPro APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: yazedteacherpro-android-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Import Android source on first run
        shell: bash
        run: |
          set -euo pipefail
          if [ -d bootstrap ]; then
            TARGET_BRANCH="${GITHUB_HEAD_REF:-main}"
            {
              head -c 8000 bootstrap/part01.txt
              cat bootstrap/part02.txt bootstrap/part03.txt bootstrap/part04.txt bootstrap/part05.txt
            } | base64 -d > /tmp/YazedTeacherPro_Source.zip
            rm -rf /tmp/yazed-src
            mkdir -p /tmp/yazed-src
            unzip -q /tmp/YazedTeacherPro_Source.zip -d /tmp/yazed-src
            cp -a /tmp/yazed-src/YazedTeacherPro/. .
            rm -rf bootstrap
            rm -f .github/workflows/android-apk.yml
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "Import YazedTeacherPro Android source"
            git push origin HEAD:"${TARGET_BRANCH}"
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses >/dev/null || true

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Restore stable debug keystore
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: yazedteacherpro-android-debug-keystore-v1

      - name: Build installable APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Prepare APK
        run: cp app/build/outputs/apk/debug/app-debug.apk YazedTeacherPro.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: YazedTeacherPro-APK
          path: YazedTeacherPro.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish latest APK release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release delete latest --cleanup-tag -y 2>/dev/null || true
          git push origin :refs/tags/latest 2>/dev/null || true
          gh release create latest YazedTeacherPro.apk \
            --title "YazedTeacherPro - Latest Android APK" \
            --notes "Installable Android APK built automatically by GitHub Actions from commit ${GITHUB_SHA}."
